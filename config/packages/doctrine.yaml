doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        types:
            task_id: App\Infrastructure\Doctrine\Type\TaskIdType
            task_title: App\Infrastructure\Doctrine\Type\TaskTitleType
            task_status: App\Infrastructure\Doctrine\Type\TaskStatusType
            workspace_id: App\Infrastructure\Doctrine\Type\WorkspaceIdType
            workspace_name: App\Infrastructure\Doctrine\Type\WorkspaceNameType
            member_id: App\Infrastructure\Doctrine\Type\MemberIdType
            member_role: App\Infrastructure\Doctrine\Type\MemberRoleType
            member_id_collection: App\Infrastructure\Doctrine\Type\MemberIdCollectionType
    orm:
        validate_xml_mapping: true
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            App:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine'
                prefix: 'App\Domain'
                alias: App

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool
    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system